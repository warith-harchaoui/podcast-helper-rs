# Rust port of https://github.com/warith-harchaoui/podcast-helper (Python).
# Scope v0.1: "URL in, PCM out" for local files, direct audio URLs, and RSS/Atom
# feeds (auto-picks the latest episode). yt-dlp-compatible sources (YouTube,
# Vimeo, SoundCloud, Twitch...) are detected but delegated to `youtube-helper-rs`,
# which is not published yet — see README "Not built yet" and the tracking issue.
[package]
name = "podcast-helper-rs"
version = "0.1.0"
edition = "2021"
description = "URL in, PCM out: local files, direct audio URLs, and RSS/Atom podcast feeds decoded via ffmpeg. Rust port of podcast-helper."
license = "BSD-3-Clause"
repository = "https://github.com/warith-harchaoui/podcast-helper-rs"
readme = "README.md"
authors = ["Warith HARCHAOUI"]
keywords = ["podcast", "rss", "audio", "ffmpeg", "pcm"]
categories = ["multimedia::audio", "parser-implementations"]

[dependencies]
# RSS + Atom parsing in one unified model, so we never hand-roll an XML parser.
feed-rs = "2"
# Blocking HTTP client, matching the sibling scribe-reunion crates' convention
# (ureq over reqwest: no async runtime pulled into a library crate).
ureq = "2"
# URL parsing for source-kind classification (file / direct audio / feed / DRM).
url = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
# Used only in tests, to synthesize a tiny local WAV fixture that ffmpeg decodes,
# so the ffmpeg adapter is exercised by a real subprocess without any network call.
hound = "3"
