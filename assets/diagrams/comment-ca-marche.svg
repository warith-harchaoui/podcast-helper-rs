<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1237 432" width="1237" height="432" role="img" aria-labelledby="phrf-title phrf-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="phrf-title">Comment podcast-helper-rs fonctionne : n'importe quelle URL de podcast en entrée, du PCM en sortie, le DRM refusé plutôt que simulé</title>
  <desc id="phrf-desc">Une planche qui se lit de gauche à droite. Entrée : une URL ou un chemin, qui peut être un fichier local, une adresse audio directe, un flux RSS ou Atom, un hôte yt-dlp, ou une page de catalogue verrouillée par DRM. Le travail, en trois étapes numérotées : la source est classée dans l'une de ces catégories, puis une page Spotify ou Apple Podcasts est refusée d'emblée avec un renvoi vers le flux public de l'émission ; un flux est ensuite analysé par feed-rs puis son dernier épisode sélectionné, la durée iTunes étant relue par quick-xml parce que feed-rs lit mal la forme MM:SS ; enfin ffmpeg décode ce à quoi tout cela a abouti. Sortie : des échantillons PCM en mémoire, ou une URL de flux pour un média qui ne finit jamais. Dessous, un seul crate qui interdit le code unsafe puis documente chaque élément public, déléguant les hôtes yt-dlp à youtube-helper-rs. On l'atteint par trois surfaces : une API Rust, une ligne de commande clap derrière une option de compilation, puis un skill d'agent.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="phrf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="168" height="78" rx="10"/>
  <text class="n-title" x="112" y="120" text-anchor="middle">une URL ou un chemin</text>
  <text class="n-sub" x="112" y="139" text-anchor="middle">fichier, flux ou hôte</text>
  <path class="flow" d="M202 126 H218" marker-end="url(#phrf-arrow)"/>
  <rect class="panel" x="222" y="54" width="772" height="144" rx="12"/>
  <text class="panel-label" x="242" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="242" y="94" width="212" height="78" rx="10"/>
  <text class="n-title" x="348" y="127" text-anchor="middle">classer la source</text>
  <text class="n-sub" x="348" y="146" text-anchor="middle">fichier / direct / flux / DRM</text>
  <text class="step" x="253" y="110">1</text>
  <path class="flow" d="M458 133 H474" marker-end="url(#phrf-arrow)"/>
  <rect class="stage" x="480" y="94" width="248" height="78" rx="10"/>
  <text class="n-title" x="604" y="127" text-anchor="middle">résoudre l'épisode</text>
  <text class="n-sub" x="604" y="146" text-anchor="middle">feed-rs, durée par quick-xml</text>
  <text class="step" x="491" y="110">2</text>
  <path class="flow" d="M732 133 H748" marker-end="url(#phrf-arrow)"/>
  <rect class="stage" x="754" y="94" width="220" height="78" rx="10"/>
  <text class="n-title" x="864" y="127" text-anchor="middle">décoder</text>
  <text class="n-sub" x="864" y="146" text-anchor="middle">ffmpeg, quoi que ce soit devenu</text>
  <text class="step" x="765" y="110">3</text>
  <path class="flow" d="M1000 126 H1016" marker-end="url(#phrf-arrow)"/>
  <text class="panel-label" x="1020" y="40">SORTIE</text>
  <rect class="io" x="1020" y="87" width="189" height="78" rx="10"/>
  <text class="n-title" x="1114" y="120" text-anchor="middle">du PCM, ou une URL</text>
  <text class="n-sub" x="1114" y="139" text-anchor="middle">une URL si ça ne finit jamais</text>
  <rect class="core" x="392" y="232" width="432" height="54" rx="10"/>
  <text class="on-dark" x="608" y="253" text-anchor="middle">un seul crate, aucun unsafe, tout documenté</text>
  <text class="on-dark-sub" x="608" y="272" text-anchor="middle">hôtes yt-dlp délégués à youtube-helper-rs</text>
  <path class="tie" d="M608 286 V314 H408 V332"/>
  <path class="tie" d="M608 314 H808 V332"/>
  <path class="tie" d="M608 314 V332"/>
  <rect class="surface" x="318" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="408" y="360" text-anchor="middle">API Rust</text>
  <rect class="surface" x="518" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="608" y="360" text-anchor="middle">CLI (clap, en option)</text>
  <rect class="surface" x="718" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="808" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="608" y="412" text-anchor="middle">Une page de catalogue verrouillée par DRM est refusée d'emblée, avec un renvoi vers le flux public — la seule réponse qui ne soit ni un plantage ni un faux-semblant de réussite.</text>
</svg>
